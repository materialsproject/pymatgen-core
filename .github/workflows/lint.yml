name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools-scm needs the vYYYY.M.D tags to version the project; a tagless shallow
          # clone gives 0.1.devN, which cannot satisfy matgl's pymatgen-core>=2026.x requirement.
          fetch-depth: 0

      - name: Install uv with python version.
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --upgrade

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pyright
        run: uv run pyright src
